spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

auth:
  app:
    jwtCookieName: auth
    jwtExpirationMs: ${JWT_EXPIRATION_MS}
    jwtSecret: ${JWT_SECRET}
    jwtRefresh: ${JWT_REFRESH}

carga:
  max-filas: ${CARGA_MAX_FILAS:50000}
