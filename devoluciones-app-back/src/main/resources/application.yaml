spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

auth:
  app:
    jwtCookieName: auth
    jwtExpirationMs: ${JWT_EXPIRATION_MS}
    jwtSecret: ${JWT_SECRET}
    jwtRefresh: ${JWT_REFRESH}
